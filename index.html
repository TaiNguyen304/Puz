<!DOCTYPE html>
<html lang="vi">
<head> 
    <meta charset="UTF-8">
    <title>Màn Hình Hiển Thị Ô Chữ (Khán Giả)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Nút ẩn/hiện dùng để kích hoạt bảng điều khiển bằng tay */
        #openControlBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 10px 15px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            cursor: pointer;
            z-index: 9999;
            opacity: 0.3; /* Làm mờ để khán giả đỡ thấy */
        }
        #openControlBtn:hover { opacity: 1; }
    </style>
</head>
<body>

    <button id="openControlBtn" onclick="openController()">MỞ BẢNG ĐIỀU KHIỂN</button>

    <div id="board"></div>

    <script src="quiz.js"></script>
    <script src="script.js"></script>
</body>
</html>
