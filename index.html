<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Màn Hình Hiển Thị Ô Chữ (Khán Giả)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *,
        body,
        div,
        p,
        span {
            font-weight: bold !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        #scoreContainer {
            display: flex;
            justify-content: center;
            gap: 160px;
            margin: 80px auto 90px auto;
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Black.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        .score-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'SVN-Gilroy', sans-serif;
            width: 60px;
            height: 20px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            padding: 2px 4px;
            box-sizing: border-box;
            white-space: nowrap;
            transform: scale(5);
            transform-origin: center;
            margin-top: 10px;
            margin-left: 70px;
            margin-right: 70px;
        }

        .score-box .player-name-label {
            font-size: 5px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 0.2px;
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: translateY(1.2px);
        }

        .score-box .player-score-val {
            font-size: 7px;
            font-weight: bold;
            line-height: 1;
            display: block;
            margin-bottom: -1px;
        }

        .score-red {
            background-image: url("scorered.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-yellow {
            background-image: url("scoreyellow.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-blue {
            background-image: url("scoreblue.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-black {
            background-image: url("scoreboard.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
            border: none !important;
        }

        #scoreContainer.score-hidden {
            display: none !important;
        }

        #board {
            position: relative;
            margin-top: 20px;
            background: url("khungbang.png") center center no-repeat;
            background-size: 100% 100%;
            transition: background 0.3s ease;
        }
    </style>
</head>

<body>

    <div id="scoreContainer">
        <div id="scoreBox1" class="score-box score-red">
            <span id="p1NameLabel" class="player-name-label">PLAYER 1</span>
            <span id="p1ScoreVal" class="player-score-val">0</span>
        </div>
        <div id="scoreBox2" class="score-box score-yellow">
            <span id="p2NameLabel" class="player-name-label">PLAYER 2</span>
            <span id="p2ScoreVal" class="player-score-val">0</span>
        </div>
        <div id="scoreBox3" class="score-box score-blue">
            <span id="p3NameLabel" class="player-name-label">PLAYER 3</span>
            <span id="p3ScoreVal" class="player-score-val">0</span>
        </div>
    </div>

    <div id="board"></div>

</body>
