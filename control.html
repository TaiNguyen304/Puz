<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Điều Khiển Ô Chữ (Kỹ Thuật)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; padding: 20px; text-align: center;}
        h3 { margin-top: 20px; border-bottom: 1px solid #444; padding-bottom: 5px; color: #5ac8fa;}
        .group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        button { padding: 15px 25px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; min-width: 100px;}
        .btn-main { background-color: green; color: white; }
        .btn-reveal { background-color: blue; color: white; }
        .btn-reset { background-color: #ff00ff; color: white; font-weight: bold; }
        .btn-tossup { background-color: yellow; color: black; }
        .btn-solve { background-color: yellow; color: black; }
        .btn-quiz { background-color: #34495e; color: white; }
        button:hover {background-color: orange !important; color: white !important; }
        
        /* Giao diện nút chữ cái */
        #alphabetSection { display: flex; }
        .btn-letter { background-color: purple; color: #fff; min-width: 50px; padding: 12px; margin: 4px; font-size: 16px; border-radius: 4px; }
        .btn-letter:disabled { background-color: #555 !important; color: #aaa !important; cursor: not-allowed; }
        
        /* Trạng thái active */
        .active { background-color: red !important; color: white !important; box-shadow: 0 0 10px #ff3b30; }

        /* Giao diện Popup tự chế */
        .custom-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center;
        }
        .custom-popup-box {
            background: #333; border: 2px solid #5ac8fa; padding: 25px 40px; border-radius: 8px; 
            text-align: center; max-width: 420px; box-shadow: 0 0 20px rgba(90, 200, 250, 0.6);
        }
        .custom-popup-msg { font-size: 16px; margin-bottom: 20px; color: #fff; font-weight: bold; line-height: 1.5; }
        .custom-popup-btn { background: #5ac8fa; color: #000; padding: 10px 30px; font-weight: bold; border-radius: 5px; min-width: 80px; }
        .custom-popup-btn:hover { background: #34495e; color: #fff; }
    </style>
</head>
<body>

    <h2>BẢNG ĐIỀU KHIỂN TRÒ CHƠI</h2>

    <h3>Hệ thống chính</h3>
    <div class="group">
        <button class="btn-main" onclick="sendCmd('SHOW_BOARD')">SHOW Ô CHỮ</button>
        <button class="btn-reveal" onclick="sendCmd('REVEAL_ALL')">MỞ HẾT TOÀN BỘ</button>
        <button class="btn-reset" onclick="sendCmd('RESET_BOARD')">RESET BẢNG TRỐNG</button>
        <input type="file" id="excelInput" accept=".xlsx, .xls" style="display:none;" onchange="handleExcel(this)">
    </div>

    <h3>Vòng đoán nhanh (Toss-up)</h3>
    <div class="group">
        <button class="btn-tossup" id="startBtn" onclick="sendCmd('START_TOSSUP')">START</button>
        <button class="btn-tossup" id="pauseBtn" onclick="sendCmd('PAUSE_TOSSUP')">PAUSE</button>
        <button class="btn-tossup" id="playBtn" onclick="sendCmd('PLAY_TOSSUP')">PLAY</button>
        <button class="btn-solve" id="solveBtn" onclick="solveTossUp()">SOLVE</button>
    </div>

    <h3>Chọn đề bài (1 - 12)</h3>
    <div class="group">
        <script>
            for(let i=1; i<=12; i++) {
                document.write(`<button class="btn-quiz" id="btnQuiz${i}" onclick="sendCmd('LOAD_QUIZ', ${i-1})">ĐỀ ${i}</button>`);
            }
        </script>
    </div>

    <div id="alphabetSection" style="display: none;">
        <h3>Bàn phím đoán chữ cái (Đề đoán chữ)</h3>
        <div class="group" id="alphabetContainer">
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <label style="font-weight: bold; color: aqua;">SỐ Ô CẦN MỞ:</label>
            <input type="number" id="numCells" style="font-weight: bold; padding: 5px; width: 60px; margin-left: 10px; text-align: center; border-radius: 4px;" min="0" max="52" oninput="generateChildTextBoxes()">
        </div>
        
        <div id="childTextBoxes" class="group" style="margin-top: 15px;"></div>
        
        <div class="group" style="margin-top: 15px;">
            <button class="btn-reset" onclick="triggerSequence('MARK_SEQ')">MỞ LẦN 1 (ĐÁNH DẤU)</button>
            <button class="btn-reset" onclick="triggerSequence('REVEAL_SEQ')">MỞ LẦN 2 (MỞ CHỮ)</button>
        </div>

        <div id="extraLettersSection" style="display: none; margin-top: 20px; border: 2px dashed #5ac8fa; padding: 15px; border-radius: 8px;">
            <h3 style="color: #39ff14; margin-top: 0; border: none;">Chữ cái đoán thêm:</h3>
            <div class="group" id="extraLettersContainer">
                <script>
                    for(let i=0; i<10; i++) {
                        document.write('<input type="text" maxlength="1" class="extra-letter-input" style="width: 35px; height: 35px; font-weight: bold; text-align: center; font-size: 18px; margin: 0 3px; text-transform: uppercase; border-radius: 4px; border: 1px solid #ccc;">');
                    }
                </script>
            </div>
            <div class="group" style="margin-top: 15px;">
                <button style="background-color: green; color: white; font-weight: bold;" onclick="confirmExtraLetters()">XÁC NHẬN</button>
                <button style="background-color: blue; color: white; font-weight: bold;" onclick="clearExtraLetters()">XÓA TẤT CẢ</button>
            </div>
        </div>
    </div>

    <div id="customPopup" class="custom-popup-overlay">
        <div class="custom-popup-box">
            <p id="popupMessage" class="custom-popup-msg"></p>
            <button class="custom-popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        // Danh sách 29 chữ cái Tiếng Việt chuẩn (Đã viết hoa)
        const vietnameseAlphabet = ["A","Ă","Â","B","C","D","Đ","E","Ê","G","H","I","K","L","M","N","O","Ô","Ơ","P","Q","R","S","T","U","Ư","V","X","Y"];
        
        // Render 29 nút chữ cái vào giao diện
        const container = document.getElementById("alphabetContainer");
        vietnameseAlphabet.forEach(letter => {
            const btn = document.createElement("button");
            btn.className = "btn-letter";
            btn.id = `btn-char-${letter}`;
            btn.textContent = letter;
            btn.onclick = () => {
                btn.disabled = true; // Bấm xong vô hiệu hóa luôn nút đó
                sendCmd('GUESS_LETTER', letter);
            };
            container.appendChild(btn);
        });

        // Hàm xử lý nút SOLVE ở Vòng đoán nhanh
        function solveTossUp() {
            // Phát âm thanh ClearTossUp.mp3 tại máy điều khiển
            const audio = new Audio('ClearTossUp.mp3');
            audio.play().catch(err => console.log("Chưa tương tác hoặc file âm thanh lỗi:", err));
            
            // Đồng thời gửi lệnh mở hết và lệnh solve qua màn hình chính
            sendCmd('REVEAL_ALL');
            sendCmd('SOLVE_TOSSUP');
        }

        // Hàm hiển thị Popup thay thế alert
        function showCustomAlert(message) {
            document.getElementById("popupMessage").textContent = message;
            document.getElementById("customPopup").style.display = "flex";
        }

        // Hàm đóng Popup
        function closePopup() {
            document.getElementById("customPopup").style.display = "none";
        }

        function sendCmd(type, data = null) {
            if (window.opener) {
                window.opener.postMessage({ type: type, data: data }, "*");
            } else {
                showCustomAlert("Lỗi: Hãy bấm nút mở từ trang hiển thị chính để kết nối!");
            }
        }

        function generateChildTextBoxes(autoValues = []) {
            const num = parseInt(document.getElementById("numCells").value) || 0;
            const container = document.getElementById("childTextBoxes");
            container.innerHTML = "";
            
            for (let i = 0; i < num; i++) {
                const input = document.createElement("input");
                input.type = "number";
                input.className = "child-pos-input";
                input.style.cssText = "font-weight: bold; width: 45px; padding: 10px; text-align: center; border-radius: 4px;";
                input.min = 1;
                input.max = 52;
                if (autoValues[i] !== undefined) {
                    input.value = autoValues[i];
                }
                container.appendChild(input);
            }
        }

        // Hàm gom vị trí và gửi lệnh lật tuần tự
        function triggerSequence(actionType) {
            const inputs = document.querySelectorAll(".child-pos-input");
            let positions = [];
            inputs.forEach(input => {
                const val = parseInt(input.value);
                if (!isNaN(val) && val >= 1 && val <= 52) {
                    positions.push(val);
                }
            });
            
            if (positions.length > 0) {
                // Sắp xếp tăng dần từ trái qua phải, trên xuống dưới
                positions.sort((a, b) => a - b);
                sendCmd(actionType, positions);
            } else {
                return;
            }
        }

        function confirmExtraLetters() {
            const inputs = document.querySelectorAll(".extra-letter-input");
            let letters = [];
            inputs.forEach(inp => {
                const val = inp.value.trim().toUpperCase();
                if (val !== "") letters.push(val);
            });
            
            if (letters.length === 0) {
                showCustomAlert("Vui lòng nhập ít nhất 1 chữ cái!");
                return;
            }
            // Gửi mảng chữ cái sang màn hình chính
            sendCmd("GUESS_MULTI_LETTERS", letters);
        }

        function clearExtraLetters() {
            document.querySelectorAll(".extra-letter-input").forEach(inp => inp.value = "");
        }

        // Lắng nghe phản hồi từ màn hình chính gửi về
        window.addEventListener("message", (event) => {
            const { type, data } = event.data;
            
            if (type === "UPDATE_QUIZ_ACTIVE") {
                for (let i = 1; i <= 12; i++) {
                    document.getElementById(`btnQuiz${i}`).classList.remove("active");
                }
                document.getElementById(`btnQuiz${data + 1}`).classList.add("active");

                const targetQuizzes = [2, 3, 4, 8, 9, 10, 11];
                if (targetQuizzes.includes(data)) {
                    document.getElementById("alphabetSection").style.display = "block";
                } else {
                    document.getElementById("alphabetSection").style.display = "none";
                }
                
                if ([9, 10, 11].includes(data)) {
                    document.getElementById("extraLettersSection").style.display = "block";
                } else {
                    document.getElementById("extraLettersSection").style.display = "none";
                }

                document.querySelectorAll(".btn-letter").forEach(btn => btn.disabled = false);
                
                // Xóa trống các textbox khi sang đề mới
                document.getElementById("numCells").value = "";
                document.getElementById("childTextBoxes").innerHTML = "";
            }
            
            if (type === "UPDATE_CTRL_ACTIVE") {
                document.getElementById("startBtn").classList.remove("active");
                document.getElementById("pauseBtn").classList.remove("active");
                document.getElementById("playBtn").classList.remove("active");
                if (data) document.getElementById(data).classList.add("active");
            }

            // Xử lý khi nhận mảng vị trí từ bảng chính trả về
            if (type === "FILL_POSITIONS") {
                document.getElementById("numCells").value = data.length;
                generateChildTextBoxes(data);
            }
        });
    </script>
</body>
</html>
