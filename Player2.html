<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Player 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *,
        body,
        div,
        p,
        span,
        button {
            font-weight: bold !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        #leftContainer {
            width: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }

        #rightContainer {
            width: 20%;
            background: #222;
            border-left: 3px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            padding: 20px 10px;
            box-sizing: border-box;
            height: 100vh;
        }

        #scoreContainer {
            display: flex;
            justify-content: center;
            gap: 160px;
            margin: 80px auto 90px auto;
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Black.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        .score-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'SVN-Gilroy', sans-serif;
            width: 60px;
            height: 20px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            padding: 2px 4px;
            box-sizing: border-box;
            white-space: nowrap;
            transform: scale(5);
            transform-origin: center;
            margin-top: 10px;
            margin-left: 70px;
            margin-right: 70px;
        }

        .score-box .player-name-label {
            font-size: 5px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 0.2px;
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: translateY(1.2px);
        }

        .score-box .player-score-val {
            font-size: 7px;
            font-weight: bold;
            line-height: 1;
            display: block;
            margin-bottom: -1px;
        }

        .score-red {
            background-image: url("scorered.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-yellow {
            background-image: url("scoreyellow.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-blue {
            background-image: url("scoreblue.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-black {
            background-image: url("scoreboard.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
            border: none !important;
        }

        #scoreContainer.score-hidden {
            display: none !important;
        }

        #board {
            position: relative;
            margin-top: 20px;
            transform: scale(0.9);
            transform-origin: top center;
            background: url("khungbang.png") center center no-repeat;
            background-size: 100% 100%;
        }

        .status-box {
            width: 90%;
            padding: 20px 10px;
            font-size: 18px;
            text-align: center;
            border-radius: 8px;
            background: purple;
            color: #fff;
            box-sizing: border-box;
        }

        .status-p1-active {
            background-color: #FF0000 !important;
            color: #ffffff !important;
        }

        .status-p2-active {
            background-color: #FFFF00 !important;
            color: #000000 !important;
        }

        .status-p3-active {
            background-color: #0000FF !important;
            color: #ffffff !important;
        }

        #buzzerBtn {
            width: 90%;
            height: 1200px;
            font-size: 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .buzzer-unlocked {
            background: #ffffff;
            color: #000000;
        }

        .buzzer-unlocked:hover {
            background: orange;
            color: white;
        }

        .buzzer-locked {
            background: #000000;
            color: #ffffff;
            border: 3px solid #fff;
            cursor: not-allowed;
        }

        .buzzer-p1-active,
        .buzzer-p1-active:hover {
            background: #ff0000 !important;
            color: #ffffff !important;
            border: none !important;
            cursor: not-allowed;
        }

        .buzzer-p2-active,
        .buzzer-p2-active:hover {
            background: #ffff00 !important;
            color: #000000 !important;
            border: none !important;
            cursor: not-allowed;
        }

        .buzzer-p3-active,
        .buzzer-p3-active:hover {
            background: #0000ff !important;
            color: #ffffff !important;
            border: none !important;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="leftContainer">
        <div id="scoreContainer">
            <div id="scoreBox1" class="score-box score-red">
                <span id="p1NameLabel" class="player-name-label">PLAYER 1</span>
                <span id="p1ScoreVal" class="player-score-val">0</span>
            </div>
            <div id="scoreBox2" class="score-box score-yellow">
                <span id="p2NameLabel" class="player-name-label">PLAYER 2</span>
                <span id="p2ScoreVal" class="player-score-val">0</span>
            </div>
            <div id="scoreBox3" class="score-box score-blue">
                <span id="p3NameLabel" class="player-name-label">PLAYER 3</span>
                <span id="p3ScoreVal" class="player-score-val">0</span>
            </div>
        </div>
        <div id="board"></div>
    </div>

    <div id="rightContainer">
        <div id="statusBox1" class="status-box">PLAYER 1</div>
        <div id="statusBox2" class="status-box">PLAYER 2</div>

        <button id="buzzerBtn" class="buzzer-locked" disabled onclick="pressBuzzer()">CHUÔNG</button>
    </div>
