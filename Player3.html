<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Player 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, body, div, p, span, button {
            font-weight: bold !important;
        }
        body {
            margin: 0; padding: 0; background: #111;
            display: flex; flex-direction: row; height: 100vh; overflow: hidden;
        }
        #leftContainer {
            width: 80%; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; overflow-y: auto;
        }
        #rightContainer {
            width: 20%; background: #222; border-left: 3px solid #444;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; gap: 20px; padding: 20px 10px; box-sizing: border-box;
            height: 100vh; /* Kéo full chiều cao màn hình */
        }
        @font-face {
            font-family: 'UTM HELVETINS';
            src: url('UTM HELVETINS_3.TTF') format('truetype');
        }

        #scoreContainer {
            display: flex;
            justify-content: center;
            /* Giữ khoảng cách gap lớn để bù trừ không gian vật lý khi scale(5) */
            gap: 160px;
            margin: 80px auto 90px auto;
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .score-box {
            display: inline-flex;
            align-items: flex-end;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'UTM HELVETINS', Arial, sans-serif;

            /* Cố định kích thước khung chữ gốc siêu nhỏ để khi scale(5) lên ảnh không bị biến dạng */
            width: 60px;
            /* Khi nhân 5 sẽ tương đương rộng 300px trên màn hình */
            height: 20px;
            /* Khi nhân 5 sẽ tương đương cao 100px trên màn hình */

            /* Ép ảnh vừa khít theo tỷ lệ khung, không dùng contain tự co giãn nữa nhằm tránh bị phình bự */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;

            /* Bỏ padding px lớn cũ để tránh làm tăng kích thước div khi chữ dài ra */
            padding: 0 4px 2.5px 4px;
            box-sizing: border-box;

            /* Font size gốc */
            font-size: 8px;
            white-space: nowrap;
            /* Không cho phép xuống dòng khi chuỗi số dài */

            /* Thực hiện scale(5) giữ nguyên phông dáng */
            transform: scale(5);
            transform-origin: center;

            /* Giảm bớt margin ngoài vì gap và width/height ở trên đã đủ căn khoảng cách */
            margin-top: 10px;
            margin-left: 70px;
            margin-right: 70px;
        }

        /* Giữ nguyên phần map ảnh nền */
        .score-red {
            background-image: url("scorered.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-yellow {
            background-image: url("scoreyellow.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-blue {
            background-image: url("scoreblue.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-black {
            background-image: url("scoreboard.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
            border: none !important;
        }

        #board {
            position: relative; margin-top: 20px; transform: scale(0.9); transform-origin: top center;
            background: url("khungbang.png") center center no-repeat; background-size: 100% 100%;
        }
        .status-box {
            width: 90%; padding: 20px 10px; font-size: 18px; text-align: center;
            border-radius: 8px; background: purple; color: #fff; box-sizing: border-box;
        }
        .status-p1-active { background-color: #FF0000 !important; color: #ffffff !important; }
        .status-p2-active { background-color: #FFFF00 !important; color: #000000 !important; }
        .status-p3-active { background-color: #0000FF !important; color: #ffffff !important; }

        /* Nút bấm chuông dạng hình chữ nhật */
        #buzzerBtn {
            width: 90%; height: 1200px; font-size: 24px; border: none; border-radius: 8px;
            cursor: pointer; transition: all 0.2s ease; margin-top: auto; /* Đẩy nút xuống dưới cùng */
        }
        .buzzer-unlocked { background: #ffffff; color: #000000; }
        .buzzer-unlocked:hover {background: orange;color: white;}
        .buzzer-locked { background: #000000; color: #ffffff; border: 3px solid #fff; cursor: not-allowed; }

        /* Nút bấm chuông dạng hình chữ nhật */
#buzzerBtn {

}

/* --- PHẦN THÊM MỚI: GIỮ NGUYÊN MÀU KHI HOVER CHO TỪNG PLAYER --- */
.buzzer-p1-active, .buzzer-p1-active:hover { background: #ff0000 !important; color: #ffffff !important; border: none !important; cursor: not-allowed; }
.buzzer-p2-active, .buzzer-p2-active:hover { background: #ffff00 !important; color: #000000 !important; border: none !important; cursor: not-allowed; }
.buzzer-p3-active, .buzzer-p3-active:hover { background: #0000ff !important; color: #ffffff !important; border: none !important; cursor: not-allowed; }
    </style>
</head>
