<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Host</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *,
        body,
        div,
        p,
        span,
        button,
        input {
            font-weight: bold !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        #leftContainer {
            width: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }

        #rightContainer {
            width: 20%;
            background: #222;
            border-left: 3px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding: 15px 10px;
            box-sizing: border-box;
            height: 100vh;
            overflow-y: auto;
        }

        #scoreContainer {
            display: flex;
            justify-content: center;
            gap: 160px;
            margin: 80px auto 90px auto;
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Black.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        .score-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'SVN-Gilroy', sans-serif;
            width: 60px;
            height: 20px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: 100% 100%;
            padding: 2px 4px;
            box-sizing: border-box;
            white-space: nowrap;
            transform: scale(5);
            transform-origin: center;
            margin-top: 10px;
            margin-left: 70px;
            margin-right: 70px;
        }

        .score-box .player-name-label {
            font-size: 5px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 0.2px;
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: translateY(1.2px);
        }

        .score-box .player-score-val {
            font-size: 7px;
            font-weight: bold;
            line-height: 1;
            display: block;
            margin-bottom: -1px;
        }

        .score-red {
            background-image: url("scorered.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-yellow {
            background-image: url("scoreyellow.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-blue {
            background-image: url("scoreblue.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
        }

        .score-black {
            background-image: url("scoreboard.png") !important;
            color: #ffffff !important;
            background-color: transparent !important;
            border: none !important;
        }

        #scoreContainer.score-hidden {
            display: none !important;
        }

        #board {
            position: relative;
            margin-top: 20px;
            transform: scale(0.9);
            transform-origin: top center;
            background: url("khungbang.png") center center no-repeat;
            background-size: 100% 100%;
        }

        .status-box {
            width: 100%;
            padding: 12px 10px;
            font-size: 16px;
            text-align: center;
            border-radius: 8px;
            background: purple;
            color: #fff;
            box-sizing: border-box;
        }

        .status-p1-active {
            background-color: #FF0000 !important;
            color: #ffffff !important;
        }

        .status-p2-active {
            background-color: #FFFF00 !important;
            color: #000000 !important;
        }

        .status-p3-active {
            background-color: #0000FF !important;
            color: #ffffff !important;
        }

        .host-player-row {
            width: 100%;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #444;
        }

        .p1-row {
            border-left: 5px solid #ff0000;
        }

        .p2-row {
            border-left: 5px solid #ffff00;
        }

        .p3-row {
            border-left: 5px solid #0000ff;
        }

        .player-row-title {
            font-size: 13px;
            margin-bottom: 5px;
            text-align: center;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .score-sub-box {
            background: white;
            padding: 6px 2px;
            font-size: 13px;
            text-align: center;
            border-radius: 4px;
        }

        .lbl-v {
            color: black;
        }

        .lbl-t {
            color: black;
        }

        .alphabet-host-section {
            width: 100%;
            margin-top: 5px;
        }

        .alphabet-title {
            font-size: 14px;
            color: aqua;
            margin-bottom: 8px;
            text-align: center;
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            justify-content: center;
        }

        .btn-letter-host {
            background-color: purple;
            color: #fff;
            padding: 8px 0;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }

        .btn-letter-host:disabled {
            background-color: #444 !important;
            color: #888 !important;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .info-sync-panel {
            width: 100%;
            background: #333;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 13px;
            color: #fff;
            border: 1px dashed #5ac8fa;
        }

        .info-sync-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .info-sync-line:last-child {
            margin-bottom: 0;
        }

        .val-sync {
            color: #ffff00;
        }
    </style>
</head>

<body>
    <div id="leftContainer">
        <div id="scoreContainer">
            <div id="scoreBox1" class="score-box score-red">
                <span id="p1NameLabel" class="player-name-label">PLAYER 1</span>
                <span id="p1ScoreVal" class="player-score-val">0</span>
            </div>
            <div id="scoreBox2" class="score-box score-yellow">
                <span id="p2NameLabel" class="player-name-label">PLAYER 2</span>
                <span id="p2ScoreVal" class="player-score-val">0</span>
            </div>
            <div id="scoreBox3" class="score-box score-blue">
                <span id="p3NameLabel" class="player-name-label">PLAYER 3</span>
                <span id="p3ScoreVal" class="player-score-val">0</span>
            </div>
        </div>
        <div id="board"></div>
    </div>

    <div id="rightContainer">
        <div id="statusBox1" class="status-box">PLAYER 1</div>
        <div id="statusBox2" class="status-box">PLAYER 2</div>
        <div id="statusBox3" class="status-box">PLAYER 3</div>

        <div style="color: aqua; font-size: 16px; font-weight: bold; text-align: center; margin-top: 10px; border: 1px solid aqua; padding: 10px; border-radius: 6px;">THỜI GIAN CÒN LẠI: <span id="specialTimerDisplay">45</span> S</div>

        <div class="host-player-row p1-row">
            <div class="player-row-title" style="color: #ff0000;">NGƯỜI CHƠI 1</div>
            <div class="score-grid">
                <div class="score-sub-box"><span class="lbl-v">V:</span> <span id="p1HostRound">0</span></div>
                <div class="score-sub-box"><span class="lbl-t">T:</span> <span id="p1HostTotal">0</span></div>
            </div>
        </div>

        <div class="host-player-row p2-row">
            <div class="player-row-title" style="color: #ffff00;">NGƯỜI CHƠI 2</div>
            <div class="score-grid">
                <div class="score-sub-box"><span class="lbl-v">V:</span> <span id="p2HostRound">0</span></div>
                <div class="score-sub-box"><span class="lbl-t">T:</span> <span id="p2HostTotal">0</span></div>
            </div>
        </div>

        <div class="host-player-row p3-row">
            <div class="player-row-title" style="color: #0000ff;">NGƯỜI CHƠI 3</div>
            <div class="score-grid">
                <div class="score-sub-box"><span class="lbl-v">V:</span> <span id="p3HostRound">0</span></div>
                <div class="score-sub-box"><span class="lbl-t">T:</span> <span id="p3HostTotal">0</span></div>
            </div>
        </div>

        <div class="info-sync-panel">
            <div class="info-sync-line">
                <span>SỐ Ô CẦN MỞ:</span>
                <span id="syncNumCells" class="val-sync">0</span>
            </div>
            <div class="info-sync-line">
                <span>VỊ TRÍ MỞ:</span>
                <span id="syncPositions" class="val-sync">---</span>
            </div>
        </div>

        <div class="alphabet-host-section">
            <div class="alphabet-title">BẢNG CHỮ CÁI ĐOÁN</div>
            <div class="alphabet-grid" id="hostAlphabetContainer"></div>
        </div>
    </div>

    <script>
        const MY_PLAYER_ID = undefined;

        // Đăng ký callback đồng bộ trạng thái host
        window.crosswordCallbacks = window.crosswordCallbacks || [];
        window.crosswordCallbacks.push((state) => {
            console.log("Host nhận callback đồng bộ trạng thái:", state);

            resetHostAlphabetButtons();
            if (state.guessedLetters && Array.isArray(state.guessedLetters)) {
                state.guessedLetters.forEach(letter => {
                    const cleanLetter = letter.trim().toUpperCase();
                    const targetBtn = document.getElementById(`host-char-${cleanLetter}`);
                    if (targetBtn) {
                        targetBtn.disabled = true;
                    }
                });
            }

            if (state.revealedPositions && Array.isArray(state.revealedPositions)) {
                const syncNumCells = document.getElementById("syncNumCells");
                const syncPositions = document.getElementById("syncPositions");
                if (syncNumCells) syncNumCells.textContent = state.revealedPositions.length;
                if (syncPositions) syncPositions.textContent = state.revealedPositions.length > 0 ? state.revealedPositions.join("; ") : "Không có";
            }

            if (state.scoresData) {
                const scoreContainer = document.getElementById('scoreContainer');
                if (scoreContainer) {
                    if (state.isScoreVisible === false) {
                        scoreContainer.classList.add('score-hidden');
                    } else {
                        scoreContainer.classList.remove('score-hidden');
                    }
                }

                const playerMapping = [
                    { player: state.scoresData.p1, nameId: 'p1NameLabel', scoreId: 'p1ScoreVal', boxId: 'scoreBox1', defaultColor: 'score-red', hostRoundId: 'p1HostRound', hostTotalId: 'p1HostTotal' },
                    { player: state.scoresData.p2, nameId: 'p2NameLabel', scoreId: 'p2ScoreVal', boxId: 'scoreBox2', defaultColor: 'score-yellow', hostRoundId: 'p2HostRound', hostTotalId: 'p2HostTotal' },
                    { player: state.scoresData.p3, nameId: 'p3NameLabel', scoreId: 'p3ScoreVal', boxId: 'scoreBox3', defaultColor: 'score-blue', hostRoundId: 'p3HostRound', hostTotalId: 'p3HostTotal' }
                ];

                playerMapping.forEach((item) => {
                    const player = item.player;
                    if (!player) return;

                    if (document.getElementById(item.hostRoundId)) {
                        document.getElementById(item.hostRoundId).textContent = formatNumberWithDots(player.round);
                    }
                    if (document.getElementById(item.hostTotalId)) {
                        document.getElementById(item.hostTotalId).textContent = formatNumberWithDots(player.total);
                    }

                    const nameLabel = document.getElementById(item.nameId);
                    if (nameLabel) nameLabel.textContent = player.name || "PLAYER";

                    let scoreVal = (player.mode === 'ROUND') ? player.round : player.total;
                    const scoreLabel = document.getElementById(item.scoreId);
                    if (scoreLabel) scoreLabel.textContent = formatNumberWithDots(scoreVal);

                    const box = document.getElementById(item.boxId);
                    if (box) {
                        if (player.light === 'BLACK') {
                            box.className = 'score-box score-black';
                        } else {
                            box.className = `score-box ${item.defaultColor}`;
                        }
                    }
                });
            }
        });
    </script>
    <script src="script.js"></script>

    <script>
        const vietnameseLetters = ["A", "Ă", "Â", "B", "C", "D", "Đ", "E", "Ê", "G", "H", "I", "K", "L", "M", "N", "O", "Ô", "Ơ", "P", "Q", "R", "S", "T", "U", "Ư", "V", "X", "Y"];
        const alphabetContainer = document.getElementById("hostAlphabetContainer");

        vietnameseLetters.forEach(letter => {
            const btn = document.createElement("button");
            btn.className = "btn-letter-host";
            btn.id = `host-char-${letter}`;
            btn.textContent = letter;
            alphabetContainer.appendChild(btn);
        });

        function formatNumberWithDots(num) {
            if (num === undefined || num === null) return "0";
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function resetHostAlphabetButtons() {
            vietnameseLetters.forEach(letter => {
                const btn = document.getElementById(`host-char-${letter}`);
                if (btn) btn.disabled = false;
            });
        }

        if (window.supabaseClient) {
            const hostChannel = window.supabaseClient.channel('crossword_broadcast_room', {
                config: { broadcast: { ack: false, self: false } }
            });

            hostChannel.on('broadcast', { event: 'control-to-display' }, ({ payload }) => {
                const { type, data } = payload;

                if (type === "SYNC_SCORES" && data) {
                    const { scoresData, scoreVisible } = data;

                    const container = document.getElementById('scoreContainer');
                    if (container) {
                        if (scoreVisible === false) {
                            container.classList.add('score-hidden');
                        } else {
                            container.classList.remove('score-hidden');
                        }
                    }

                    if (!scoresData) return;

                    const playerMapping = [
                        { boxId: 'scoreBox1', player: scoresData.p1, defaultColor: 'score-red', nameId: 'p1NameLabel', scoreId: 'p1ScoreVal', hostRoundId: 'p1HostRound', hostTotalId: 'p1HostTotal' },
                        { boxId: 'scoreBox2', player: scoresData.p2, defaultColor: 'score-yellow', nameId: 'p2NameLabel', scoreId: 'p2ScoreVal', hostRoundId: 'p2HostRound', hostTotalId: 'p2HostTotal' },
                        { boxId: 'scoreBox3', player: scoresData.p3, defaultColor: 'score-blue', nameId: 'p3NameLabel', scoreId: 'p3ScoreVal', hostRoundId: 'p3HostRound', hostTotalId: 'p3HostTotal' }
                    ];

                    playerMapping.forEach((item) => {
                        const box = document.getElementById(item.boxId);
                        const player = item.player;
                        if (!player) return;

                        if (document.getElementById(item.hostRoundId)) {
                            document.getElementById(item.hostRoundId).textContent = formatNumberWithDots(player.round);
                        }
                        if (document.getElementById(item.hostTotalId)) {
                            document.getElementById(item.hostTotalId).textContent = formatNumberWithDots(player.total);
                        }

                        if (box) {
                            const nameLabel = document.getElementById(item.nameId);
                            if (nameLabel) nameLabel.textContent = player.name || "PLAYER";

                            let scoreVal = (player.mode === 'ROUND') ? player.round : player.total;
                            const scoreLabel = document.getElementById(item.scoreId);
                            if (scoreLabel) scoreLabel.textContent = formatNumberWithDots(scoreVal);

                            if (player.light === 'BLACK') {
                                box.className = 'score-box score-black';
                            } else {
                                box.className = `score-box ${item.defaultColor}`;
                            }
                        }
                    });
                }

                if (type === "GUESS_LETTER" && typeof data === "string") {
                    const cleanLetter = data.trim().toUpperCase();
                    const targetBtn = document.getElementById(`host-char-${cleanLetter}`);
                    if (targetBtn) {
                        targetBtn.disabled = true;
                    }
                }

                if (type === "RESET_HOST_ALPHABET" || type === "LOAD_QUIZ") {
                    resetHostAlphabetButtons();
                    document.getElementById("syncNumCells").textContent = "0";
                    document.getElementById("syncPositions").textContent = "---";
                }
            }).subscribe();
        }

        const originalSyncControlUI = window.syncControlUI;
        window.syncControlUI = function (type, data) {
            if (typeof originalSyncControlUI === 'function') {
                originalSyncControlUI(type, data);
            }

            if (type === "FILL_POSITIONS" && Array.isArray(data)) {
                document.getElementById("syncNumCells").textContent = data.length;
                document.getElementById("syncPositions").textContent = data.length > 0 ? data.join("; ") : "Không có";
            }
        };
    </script>
</body>

</html>
